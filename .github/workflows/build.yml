name: 백과사전 빌드

# 1·2 단계(게임 데이터 추출)는 여기서 돌지 않는다. 게임이 설치돼 있어야 하고,
# 파서의 online 모드는 "Not a valid Win32 FileTime" 으로 죽는다. 그래서 그 두
# 단계의 결과물만 저장소에 커밋해 두고, Action 은 3단계부터 돌린다.
on:
  push:
    branches: [main]
    paths:
      - '00_manual/**'
      - '00_scripts/**'
      - '01_auto_casc/**'
      - '02_auto_herodata/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      refresh_wiki:
        description: 'Fandom 위키를 다시 긁는다 (90번 호출, 약 3분)'
        type: boolean
        default: false
  schedule:
    # 매주 월요일 새벽. 위키가 패치를 반영했는지 확인하는 용도다.
    - cron: '0 18 * * 0'

permissions:
  # 봇이 04_auto_wiki 와 archive 를 되커밋하므로 쓰기가 필요하다
  contents: write
  pages: write
  id-token: write

# 빌드가 겹치면 뒤엣것만 남긴다. 앞엣것을 끝까지 돌릴 이유가 없다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 점검은 실제로 돌릴 것과 같은 범위를 봐야 한다. 범위가 어긋나면
      # 돌지도 않을 단계의 준비물이 없다고 빌드가 죽는다.
      - name: 계획 정하기
        id: plan
        run: |
          if [ "${{ github.event.inputs.refresh_wiki }}" = "true" ]; then
            echo 'steps=analysis,wiki,profile,build,kr,verify' >> "$GITHUB_OUTPUT"
          else
            echo 'steps=analysis,profile,build,kr,verify' >> "$GITHUB_OUTPUT"
          fi

      - name: 준비물 점검
        run: python 00_scripts/pipeline.py --only ${{ steps.plan.outputs.steps }} --check

      - name: 빌드
        run: python 00_scripts/pipeline.py --only ${{ steps.plan.outputs.steps }}

      - name: 이번 판 보관
        run: python 00_scripts/archive_build.py

      - name: 보관함을 결과물 폴더에 함께 담기
        # Pages 는 output/ 만 올린다. 보관함은 저장소 루트에 두고 올릴 때만 넣는다.
        run: cp -r archive output/archive

      - name: 바뀐 것 되돌려 놓기
        # 위키를 다시 긁었으면 그 수집분도, 새 판이 생겼으면 보관함도 함께 커밋한다.
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive CHANGELOG.md 04_auto_wiki
          if git diff --staged --quiet; then
            echo "바뀐 것이 없습니다."
          else
            git commit -m '이번 판 보관 (자동)'
            git push
          fi

      - name: 리포트 남기기
        # 실패해도 결과물은 올린다. 리포트는 사람이 볼 참고 자료지 통과 조건이 아니다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 리포트
          path: |
            07_auto_localized/xml_check.md
            07_auto_localized/wiki_inventory.md
            07_auto_localized/no_aoe.html
            07_auto_localized/report.md
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
