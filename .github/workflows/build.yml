name: 백과사전 빌드

# 매일 한국 오전 8시에 블리자드 패치 서버를 보고, 게임이 새로 나왔으면 그때만
# 처음부터 다시 만든다. 게임 데이터는 저장소에 두지 않고 CI 가 그때그때 받아 온다.
on:
  schedule:
    # 23:00 UTC = 한국 오전 8시
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '게임이 그대로여도 다시 만든다'
        type: boolean
        default: false
      refresh_wiki:
        description: 'Fandom 위키도 다시 긁는다 (90번 호출, 약 3분)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '00_manual/**'
      - '00_scripts/**'
      - '.github/workflows/build.yml'

permissions:
  # 봇이 보관함·변경 기록·위키 수집분을 되커밋한다
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 만들 이유가 있는지부터 본다. 게임이 그대로면 러너를 5분 돌릴 이유가 없다.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      build: ${{ steps.decide.outputs.build }}
      why: ${{ steps.decide.outputs.why }}
    steps:
      - uses: actions/checkout@v4

      - name: 지금 게임 빌드와 이미 만든 판 견주기
        id: decide
        run: |
          curl -sS --max-time 30 http://us.patch.battle.net:1119/hero/versions > versions.txt
          BUILD=$(awk -F'|' '/^us\|/ {print $5}' versions.txt)
          echo "패치 서버가 알려 준 빌드: ${BUILD:-읽기실패}"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

          if [ -z "$BUILD" ]; then
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo 'why=패치 서버를 못 읽었다' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != 'schedule' ]; then
            # 손으로 돌렸거나 코드가 바뀐 경우다. 게임과 무관하게 다시 만든다.
            echo 'go=true' >> "$GITHUB_OUTPUT"
            echo "why=${{ github.event_name }} 로 불렸다" >> "$GITHUB_OUTPUT"
          elif [ -d "archive/Build_$BUILD" ]; then
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "why=Build $BUILD 는 이미 만들어 뒀다" >> "$GITHUB_OUTPUT"
          else
            echo 'go=true' >> "$GITHUB_OUTPUT"
            echo "why=새 빌드 $BUILD 가 나왔다" >> "$GITHUB_OUTPUT"
          fi

      - name: 판단 남기기
        run: echo "### ${{ steps.decide.outputs.why }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: 파서 설치
        run: |
          dotnet tool install -g heroesdataparser
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 위키는 사람이 손으로 고치는 곳이라 게임 패치와 따로 논다. 평소에는
      # 커밋해 둔 수집분을 쓰고, 시켰을 때만 다시 긁는다.
      - name: 계획 정하기
        id: plan
        run: |
          if [ "${{ github.event.inputs.refresh_wiki }}" = "true" ]; then
            echo 'steps=casc,herodata,analysis,wiki,profile,build,kr,verify' >> "$GITHUB_OUTPUT"
          else
            echo 'steps=casc,herodata,analysis,profile,build,kr,verify' >> "$GITHUB_OUTPUT"
          fi

      - name: 준비물 점검
        run: |
          python 00_scripts/pipeline.py --only ${{ steps.plan.outputs.steps }} \
            --storage online --no-images --check

      # 게임 데이터를 블리자드 CDN 에서 바로 받는다. 아이콘 43MB 는 받지 않는다 -
      # 백과사전이 raw.githubusercontent.com 에서 불러오기 때문에 필요 없다.
      - name: 빌드
        run: |
          python 00_scripts/pipeline.py --only ${{ steps.plan.outputs.steps }} \
            --storage online --no-images

      - name: 만든 것이 이번 빌드가 맞는지 확인
        run: |
          grep -q "Build ${{ needs.check.outputs.build }}" output/index.html \
            || { echo "받아 온 것이 Build ${{ needs.check.outputs.build }} 가 아니다"; exit 1; }

      - name: 이번 판 보관
        run: python 00_scripts/archive_build.py

      - name: 보관함을 결과물 폴더에 함께 담기
        # Pages 는 output/ 만 올린다. 보관함은 저장소에 두고 올릴 때만 넣는다.
        run: cp -r archive output/archive

      - name: 바뀐 것 되돌려 놓기
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive CHANGELOG.md 04_auto_wiki
          if git diff --staged --quiet; then
            echo "바뀐 것이 없습니다."
          else
            git commit -m "Build ${{ needs.check.outputs.build }} 보관 (자동)"
            git push
          fi

      - name: 리포트 남기기
        # 실패해도 결과물은 올린다. 리포트는 사람이 볼 참고 자료지 통과 조건이 아니다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 리포트
          path: |
            07_auto_localized/xml_check.md
            07_auto_localized/wiki_inventory.md
            07_auto_localized/no_aoe.html
            07_auto_localized/report.md
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
